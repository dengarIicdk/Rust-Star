# Native mod manifest for Horizon (horizon-mixins bundle).
#
# Hook: `tick` (version 1). It is the only hook this port needs today and the
# only one that exists that is sufficient for simulation. Item use, entity
# spawning and block editing have no hook yet (Horizon "Planned in 0.3 / 0.5"),
# so they are not bound: a manifest naming a missing hook fails the build.

[mod]
id = "starflight"
version = "0.1.0"
priority = 100

# The Horizon commit this bundle was written against.
#
# Replace with a revision the launcher publishes for the version being tested.
# Leaving a placeholder means `native.py check` will refuse the bundle — which is
# the intended behaviour, not an oversight.
[compatibility]
horizon_revision = "0000000000000000000000000000000000000000"

[[module]]
id = "runtime"
# Becomes crate::game::starflight inside the patched client.
file = "crates/horizon-client/src/game.rs"
name = "starflight"
source = "src/runtime.rs"

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "src/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
